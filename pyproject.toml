[project]
name = "tynii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Awwal", email = "awwal2090@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-limiter>=4.1.1",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
]

[project.scripts]
tynii = "tynii:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "src.tynii.app:app"
